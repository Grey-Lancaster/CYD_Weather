; ============================================================================
; CYD Weather — ESP32-2432S028R "Cheap Yellow Display"
; ESP32-WROOM-32, ST7789 320x240 TFT (HSPI), XPT2046 touch (VSPI)
;
; This user's board (the "cyd2usb" revision, per
; https://github.com/Grey-Lancaster/CYD-PhotoFrame/blob/main/platformio.ini)
; uses an ST7789 panel controller, not the ILI9341(_2) driver the upstream
; project was originally written for — confirmed 2026-08-09 after captured
; /mirror colours came out scrambled in a way no RGB/BGR software fix could
; explain. Wrong driver still renders a mostly-correct-looking image (basic
; command sets overlap a lot between these controllers) which is why it
; wasn't obviously broken before.
;
; TFT_eSPI is configured entirely from build flags below — no User_Setup.h
; edits inside the library are required.
; ============================================================================

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
; Custom single-app partition table (see partitions.csv) — this project has
; no OTA update mechanism, so the board's default dual-app A/B partition
; table was reserving a whole unused second ~1.25MB app slot. Reclaiming it
; roughly doubles the usable app flash. Re-flashing with this table resets
; the on-device weather-history log (LittleFS data partition moves/resizes)
; but preserves NVS settings and WiFi credentials (same offset as the
; default table) — see partitions.csv's own comment for the full explanation.
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.tar.gz
    bblanchon/ArduinoJson@^7.0.4
    ; On-device WiFi picker (see network/WifiProvisioning.cpp) — replaces the
    ; old AP-mode/captive-portal setup flow. Needs LVGL (pinned to 8.3.11 per
    ; the library's own README; LVGL 9 changed the driver API entirely and
    ; won't compile against this). LVGL is scoped to just the pre-connect
    ; provisioning screen — see README's architecture notes for why the rest
    ; of the app deliberately doesn't use it.
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git
    lvgl/lvgl@^8.3.11

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    ; ---- TFT_eSPI: ST7789 panel on the HSPI port ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Touch CS (GPIO33) is declared so TFT_eSPI keeps the XPT2046 deselected
    ; during TFT transfers (and to silence its setup check). Actual touch I/O
    ; is done by XPT2046_Touchscreen on VSPI — see display/TouchManager.
    -DTOUCH_CS=33
    ; This board's panel variant (ST7789, "cyd2usb") does NOT want inversion —
    ; opposite of the ILI9341_2 config this project started from. See
    ; env:cyd2usb in the CYD-PhotoFrame repo linked above.
    -DTFT_INVERSION_OFF=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; Backlight (GPIO21) is owned by DisplayManager (LEDC PWM dimming),
    ; deliberately NOT handed to TFT_eSPI — hence no -DTFT_BL here.
    ; ---- TFT_eSPI: fonts ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
