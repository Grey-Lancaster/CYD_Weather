; ============================================================================
; CYD Weather — ESP32-2432S028R "Cheap Yellow Display" family
; ESP32-WROOM-32, 320x240 TFT (HSPI), XPT2046 touch (VSPI)
;
; One environment per panel variant, named like the CYD-PhotoFrame project's:
;
;   cyd      ILI9341 panel, normal colours   - the standard CYD, many "2 USB" boards
;   cyd2usb  ST7789 panel                    - ST7789 "2 USB" boards (the maintainer's)
;   cyd2b    ILI9341 panel, inverted colours - "2B" variant
;
; The panel driver is a compile-time choice in TFT_eSPI, so pick the env that
; matches your board (wrong one = white screen or scrambled colours; nothing is
; damaged). Orientation, colour order, mirror and inversion are runtime settings
; in the web portal; each env only sets sensible first-boot defaults for them
; (see cfg::defaults in src/config/AppConfig.h).
;
; Everything is pinned: the PlatformIO platform and every library, so a build
; today is the same build next year. TFT_eSPI is configured entirely from build
; flags — no User_Setup.h edits inside the library are needed.
;
;   pio run -e cyd2usb                  build
;   pio run -e cyd2usb -t upload        flash
; ============================================================================

[platformio]
default_envs = cyd2usb

[env]
; Pinned: newer platform releases move to Arduino-ESP32 3.x, which this project
; does not build with.
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
; Custom single-app partition table (see partitions.csv) — this project has
; no OTA update mechanism, so the board's default dual-app A/B partition
; table was reserving a whole unused second ~1.25MB app slot. Reclaiming it
; roughly doubles the usable app flash. Re-flashing with this table resets
; the on-device weather-history log (LittleFS data partition moves/resizes)
; but preserves NVS settings and WiFi credentials (same offset as the
; default table) — see partitions.csv's own comment for the full explanation.
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.tar.gz
    bblanchon/ArduinoJson@7.4.3
    ; On-device WiFi picker (see network/WifiProvisioning.cpp) — replaces the
    ; old AP-mode/captive-portal setup flow. Needs LVGL (8.x; LVGL 9 changed
    ; the driver API entirely and won't compile against this). LVGL is scoped
    ; to just the pre-connect provisioning screen — see README's architecture
    ; notes for why the rest of the app deliberately doesn't use it.
    ; Pinned to the commit (v1.5.0) this project is built and tested against.
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git#af88b2d0aea9e61c4da1767a43c6605882283c36
    lvgl/lvgl@8.4.0

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    ; ---- TFT_eSPI: panel on the HSPI port (driver chosen per env below) ----
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Touch CS (GPIO33) is declared so TFT_eSPI keeps the XPT2046 deselected
    ; during TFT transfers (and to silence its setup check). Actual touch I/O
    ; is done by XPT2046_Touchscreen on VSPI — see display/TouchManager.
    -DTOUCH_CS=33
    -DSPI_READ_FREQUENCY=20000000
    ; Backlight (GPIO21) is owned by DisplayManager (LEDC PWM dimming),
    ; deliberately NOT handed to TFT_eSPI — hence no -DTFT_BL here.
    ; ---- TFT_eSPI: fonts ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Shared by the three 2.8" variants below (240x320 native panel, dedicated touch bus).
[panel28]
build_flags =
    -DBOARD_CYD28=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=55000000

; ILI9341 panel, normal colours (the standard CYD and many "2 USB" boards).
[env:cyd]
build_flags =
    ${env.build_flags}
    ${panel28.build_flags}
    -DILI9341_2_DRIVER=1
    -DBOARD_ILI9341=1

; ST7789 panel ("2 USB" boards with an ST7789 display). This panel does NOT
; want inversion — the opposite of the ILI9341_2 config this project started
; from. Wrong driver still renders a mostly-correct-looking image (the basic
; command sets overlap a lot between these controllers), which is why a
; mismatch is easy to miss.
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    ${panel28.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DBOARD_ST7789=1

; ILI9341 panel with inverted colours ("2B" variant).
[env:cyd2b]
build_flags =
    ${env.build_flags}
    ${panel28.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DBOARD_ILI9341=1

; 3.5" CYD (ESP32-32E / ESP32-3248S035: ST7796, 320x480 native, landscape 480x320).
; Differences from the 2.8" boards: backlight on GPIO27, and the XPT2046 touch
; controller (CS 33) shares the display's SPI pins, so touch is read through
; TFT_eSPI itself (a separate touch driver would take over the display's pins and
; freeze the screen). The dashboard UI is laid out for 320x240, so it is shown
; centered on the larger panel (see cfg::display::ORIGIN_X/Y). Touch needs a
; one-time four-corner calibration on first start.
[env:cyd35]
build_flags =
    ${env.build_flags}
    -DBOARD_CYD35=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSPI_FREQUENCY=40000000
    -DSPI_TOUCH_FREQUENCY=2500000
